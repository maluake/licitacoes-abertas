name: Atualizar licitações

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 no horário de Brasília
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar licitações abertas do PNCP
        run: node scripts/coletar.mjs
        env:
          TEMPO_MAX_MIN: "50"
          UFS: "SP,RJ,MG,ES"   # estados coletados (Sudeste)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
