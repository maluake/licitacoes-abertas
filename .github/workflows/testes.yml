# Testes a cada pull request e push em outras branches.
# Usa só dados fictícios (tests/fixtures): não acessa o PNCP e não publica nada.
name: Testes

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
